name: Council Court conformance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --check src/council.mjs
      - run: node --check src/busHandoff.mjs
      - run: node --check src/round.mjs
      - run: node --check src/index.mjs
      - run: node --check src/deliveryProof.mjs
      - run: node --check scripts/strict-tests.mjs
      - run: node scripts/strict-tests.mjs
